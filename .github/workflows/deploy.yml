name: Deploy to Firebase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyA3Yd34g5YIowRFMEeVGW3mEFkZUMHcI24
          VITE_FIREBASE_AUTH_DOMAIN: plainterms-326cd.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: plainterms-326cd
          VITE_FIREBASE_STORAGE_BUCKET: plainterms-326cd.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "708696782517"
          VITE_FIREBASE_APP_ID: 1:708696782517:web:242d0e7eaf94b5521cb0fc
          VITE_APPCHECK_SITE_KEY: 6LcLmScuAAAAAMX2rnEjq6NnFJgxtHelETlx7QMZ

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/708696782517/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deploy@plainterms-326cd.iam.gserviceaccount.com

      - name: Deploy hosting and Firestore rules
        run: npx -y firebase-tools@13 deploy --only hosting,firestore:rules --project plainterms-326cd --non-interactive
